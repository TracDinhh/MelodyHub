app.name=MelodyHub
upload.base-dir=uploads
cors.allowed-origin=*

db.url=jdbc:mysql://localhost:3306/music_app?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
db.username=melodyhub
db.password=melodyhub_password
db.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=change-this-secret-for-local-dev
jwt.expires-minutes=15
refresh-token.expires-days=7

# SMTP Configuration
smtp.host=smtp.gmail.com
smtp.port=587
smtp.username=your-email@gmail.com
smtp.password=your-app-password
smtp.from.address=noreply@melodyhub.com
smtp.from.name=MelodyHub

# App
app.base-url=http://localhost:5173

# Password Reset
auth.password-reset.expiry-minutes=60

# Premium payments (VietQR needs no API key; replace the example bank details locally.)
payment.plans=MONTHLY:29000:30,QUARTERLY:79000:90
payment.currency=VND
payment.auto-confirm=false
payment.qr.vietqr.bank=970422
payment.qr.vietqr.account=0123456789
payment.qr.vietqr.account-name=NGUYEN VAN A
payment.qr.static-image-url=
